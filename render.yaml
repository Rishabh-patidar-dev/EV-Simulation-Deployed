# Render Blueprint for the EV simulation (Next.js, server-rendered).
# Data: either Supabase (SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY) or plain
# Postgres (DATABASE_URL, here the Render database below). Supabase wins when
# both are set.
services:
  - type: web
    name: ev-simulation
    runtime: node
    plan: free
    region: oregon
    branch: main
    # The app creates any missing sim_* tables itself on first request.
    buildCommand: npm ci && npm run build
    # package.json pins port 3003 for local demos; Render supplies $PORT.
    startCommand: npx next start -p $PORT
    healthCheckPath: /favicon.ico
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ev-simulation-db
          property: connectionString

databases:
  - name: ev-simulation-db
    plan: free
    region: oregon
